[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caiso2"
version = "0.1.0"
description = "CAISO optimization on the released OPTIMAS benchmark systems"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas<3", "scipy", "scikit-learn", "python-igraph", "leidenalg",
  "matplotlib", "rich", "pydantic>=2", "PyYAML", "httpx", "python-dotenv",
  "requests", "joblib", "tqdm", "litellm", "dspy==3.0.4", "datasets", "ujson",
]

[project.optional-dependencies]
benchmarks = ["torch", "transformers>=5.3,<6", "peft>=0.18", "accelerate", "wandb", "omegaconf"]
train = ["torch", "transformers>=5.3,<6", "peft>=0.18", "accelerate", "trl==0.29.0", "bitsandbytes; sys_platform == 'linux'"]
embeddings = ["sentence-transformers"]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["caiso*", "examples*", "scripts*"]

[tool.setuptools.package-data]
caiso = ["config/*.yaml", "constitution/dicai/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
